<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Genesis 2026 Portal Demo</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
/* Layout: Alta-style app shell. Top bar with logo and links on desktop, bottom tab bar on phones. Sample data only. */
:root {
  --bg: #F5F7FB; --surface: #FFFFFF; --header-bg: #FFFFFF; --ink: #1A1347; --muted: #5B6078; --line: #DCDFEA;
  --accent: #0E7C9E; --accent-strong: #0A6482; --accent-soft: #E3F4F9; --on-accent: #FFFFFF;
  --warn-soft: #FFF4DB; --warn-ink: #7A5200; --field: #B9BED0; --err: #B3261E; --err-soft: #FBEAE8;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0E1F; --surface: #151933; --header-bg: #000000; --ink: #ECEEFA; --muted: #A2A8C6; --line: #2B3055;
    --accent: #3FBBDD; --accent-strong: #7AD3EC; --accent-soft: #123341; --on-accent: #06222B;
    --warn-soft: #3A2E10; --warn-ink: #F2CC77; --field: #4A5080; --err: #FF8A80; --err-soft: #3B1A1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0E1F; --surface: #151933; --header-bg: #000000; --ink: #ECEEFA; --muted: #A2A8C6; --line: #2B3055;
  --accent: #3FBBDD; --accent-strong: #7AD3EC; --accent-soft: #123341; --on-accent: #06222B;
  --warn-soft: #3A2E10; --warn-ink: #F2CC77; --field: #4A5080; --err: #FF8A80; --err-soft: #3B1A1A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
h1, h2, h3, p, ul { margin: 0; }
h1 { font-size: 1.6rem; line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 1.1rem; }
h3 { font-size: 1rem; }
a { color: var(--accent-strong); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 0.8rem; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1000px; margin: 0 auto; }
.list { list-style: none; padding: 0; }

.logo-dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-light { display: none; } :root:not([data-theme="light"]) .logo-dark { display: block; } }
:root[data-theme="dark"] .logo-light { display: none; }
:root[data-theme="dark"] .logo-dark { display: block; }
.logo { display: block; background: #fff; border-radius: 10px; padding: 4px 10px; line-height: 0; }
.logo img { height: 34px; width: auto; display: block; }

.banner { background: var(--warn-soft); color: var(--warn-ink); font-size: 0.82rem; padding-block: 8px; }
.banner .inner { display: flex; gap: 6px 14px; flex-wrap: wrap; justify-content: space-between; }

header.top { background: var(--header-bg); border-bottom: 1px solid var(--line); }
header.top .inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.left { display: flex; align-items: center; gap: 24px; min-width: 0; }
.event { display: block; font-weight: 700; font-size: 0.95rem; color: var(--ink); white-space: nowrap; }
header.top .event { color: var(--ink); }
nav.desk { display: none; gap: 2px; }
nav.desk a { padding: 8px 12px; border-radius: 999px; font-size: 0.9rem; color: var(--ink); text-decoration: none; white-space: nowrap; }
nav.desk a:hover { background: var(--accent-soft); }
nav.desk a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.right { display: flex; align-items: center; gap: 8px; }
.pill { white-space: nowrap; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; color: var(--ink); }
.pill:hover { background: var(--accent-soft); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; }

nav.tabs-unused { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 0.7rem; color: var(--muted); border-radius: 10px; text-decoration: none; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent-strong); font-weight: 600; background: var(--accent-soft); }
@media (min-width: 900px) { nav.desk { display: flex; } nav.tabs { display: none; } main { padding-bottom: 40px !important; } }
@media (max-width: 520px) { .event { display: none; } .logo img { height: 28px; } }


/* Menu bar */
.menubar { background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 30; }
.menubar .inner { padding-block: 10px; position: relative; }
.menu-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--surface); padding: 10px 14px; cursor: pointer; text-align: left; }
.menu-btn .k { display: block; font-size: 0.7rem; color: var(--accent-strong); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.menu-btn .v { font-size: 1.02rem; font-weight: 600; }
.menu-btn svg { width: 20px; height: 20px; flex: none; transition: transform .15s; }
.menu-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.menu-panel { position: absolute; left: 0; right: 0; top: calc(100% - 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 6px; display: grid; }
.menu-panel a { display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 1rem; }
.menu-panel a svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
.menu-panel a:hover { background: var(--accent-soft); }
.menu-panel a[aria-current="page"] { background: var(--accent-soft); font-weight: 600; }
.menu-panel .sub { font-size: 0.78rem; color: var(--muted); margin-left: auto; }
.banner-img { display: block; width: 100%; height: auto; border-radius: 14px; border: 1px solid var(--line); margin-bottom: 16px; }
.mid { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: 0.02em; }
.chip.done { background: var(--line); color: var(--muted); }
.chip.ok { background: var(--accent); color: var(--on-accent); }
.box { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-top: 10px; }

main { padding-block: 24px 48px; }
.narrow { max-width: 760px; margin: 0 auto; }
.page-head { margin-bottom: 20px; display: grid; gap: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.card + .card, .card + .grid, .grid + .card, .quick + .card { margin-top: 16px; }
.divide > * + * { border-top: 1px solid var(--line); }
.divide > * { padding-block: 14px; }
.divide > *:first-child { padding-top: 0; }
.divide > *:last-child { padding-bottom: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.row > .grow { flex: 1 1 260px; min-width: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; padding: 10px 20px; font-size: 0.9rem; font-weight: 600; border: 1px solid transparent; cursor: pointer; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-strong); }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { background: var(--accent-soft); }
.chip { display: inline-block; font-size: 0.72rem; font-weight: 600; border-radius: 999px; padding: 2px 10px; background: var(--accent-soft); color: var(--accent-strong); }

/* Typing effect */
.caret::after { content: ""; display: inline-block; width: 2px; height: 1em; background: currentColor; margin-left: 3px; vertical-align: -0.12em; animation: blink 1s steps(1) infinite; }
.caret.off::after { display: none; }
@keyframes blink { 50% { opacity: 0; } }

/* Hero after login */
.hero { text-align: center; padding: 28px 16px; }
.hero .eyebrow { color: var(--muted); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }
.hero h1 { font-size: clamp(2rem, 7vw, 3.2rem); margin-block: 6px 8px; color: var(--accent-strong); }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
.quick a { text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 4px; }
.quick a:hover { border-color: var(--accent); }
.quick svg { width: 24px; height: 24px; color: var(--accent); }
.quick b { font-size: 0.95rem; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
tr.me td { background: var(--accent-soft); font-weight: 600; }
tr:last-child td { border-bottom: 0; }

/* Forms */
.auth { padding-block: 28px 40px; display: grid; place-items: center; }
.auth .card { width: min(440px, 100%); padding: 28px; display: grid; gap: 16px; }
label, .lbl { display: grid; gap: 6px; font-size: 0.88rem; font-weight: 600; }
input[type=text], input[type=email], input[type=password], input[type=url], input[type=tel] { font: inherit; border: 1px solid var(--field); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 14px; width: 100%; }
input:focus { border-color: var(--accent); }
.err { color: var(--err); background: var(--err-soft); border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; }

.steps { display: flex; gap: 6px; margin-bottom: 18px; }
.steps span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps span.on { background: var(--accent); }
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; border: 0; padding: 0; margin: 0; }
.levels label { position: relative; font-weight: 400; }
.levels input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.levels .opt { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; background: var(--surface); }
.levels b { font-size: 0.95rem; }
.levels input:checked + .opt { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.levels input:focus-visible + .opt { outline: 2px solid var(--accent); outline-offset: 2px; }
.thanks { text-align: center; display: grid; gap: 12px; justify-items: center; padding-block: 12px; }
.tick { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.tick svg { width: 30px; height: 30px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; text-align: left; margin: 0; font-size: 0.9rem; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.linkcard { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; }
.linkcard:hover { border-color: var(--accent); }
.linkcard span.go { color: var(--accent); font-size: 0.8rem; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

</div>

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  var SOCIAL = [
    ["Official website", "https://www.altaschool.tech"], ["Admissions", "https://admissions.altaschool.tech"],
    ["Instagram", "https://www.instagram.com/alta.school.of.technology/"], ["YouTube", "https://www.youtube.com/@AltaSchoolofTechnology"],
    ["LinkedIn", "https://www.linkedin.com/company/alta-school-of-technology/"]
  ];
  var CAMPUSES = [
    ["ADYPU, Pune", "https://www.altaschool.tech/campus/adypu"], ["SAGE University, Indore", "https://www.altaschool.tech/campus/sage"],
    ["IITM, Sonepat", "https://www.altaschool.tech/campus/iitm"], ["VGU, Jaipur", "https://www.altaschool.tech/campus/vgu"],
    ["DRK Institute, Hyderabad", "https://www.altaschool.tech/campus/drk"]
  ];

  function istParts(d) {
    var o = {}; new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" }).formatToParts(d).forEach(function (p) { o[p.type] = p.value; }); return o;
  }
  function atIST(ahead, hh, mm) {
    var p = istParts(new Date(Date.now() + ahead * 864e5));
    return new Date(p.year + "-" + p.month + "-" + p.day + "T" + String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0") + ":00+05:30");
  }
  function nextSat(w) { var i = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(istParts(new Date()).weekday); var a = (6 - i + 7) % 7; if (!a) a = 7; return a + 7 * w; }
  function fmtDate(d) { return new Intl.DateTimeFormat("en-IN", { timeZone: TZ, weekday: "short", day: "numeric", month: "short", year: "numeric" }).format(d); }
  function fmtTime(d) { return new Intl.DateTimeFormat("en-IN", { timeZone: TZ, hour: "numeric", minute: "2-digit", hour12: true }).format(d).toUpperCase() + " IST"; }

  var MEETING_ID = "876 5906 5462";
  var sessions = [
    { id: "s1", n: 1, when: new Date("2026-11-14T18:00:00+05:30") },
    { id: "s2", n: 2, when: new Date("2026-11-21T18:00:00+05:30") },
    { id: "s3", n: 3, when: new Date("2026-11-25T18:00:00+05:30") },
    { id: "s4", n: 4, when: new Date("2026-11-28T18:00:00+05:30") }
  ];
  var LEVELS = [
    ["Level 1", "Portfolio page", "Build and publish a one-page portfolio."],
    ["Level 2", "Data mini project", "Analyse a small dataset with arrays and prefix sums."],
    ["Level 3", "AI workflow", "Automate a task with an AI agent workflow."],
    ["Level 4", "Final project", "An idea built end to end and ready to demo."]
  ];
  var board = [["Isha Verma", 940], ["Rohan Iyer", 905], ["Meera Nair", 870], ["Aarav Mehta", 855], ["Kabir Singh", 855], ["Ananya Rao", 810], ["Dev Patel", 790], ["Sara Khan", 760], ["Vikram Das", 720], ["Tanvi Joshi", 695]];
  var ranked = (function () {
    var r = 0, last = null;
    return board.slice().sort(function (a, b) { return b[1] - a[1]; }).map(function (x, i) { if (x[1] !== last) { r = i + 1; last = x[1]; } return { name: x[0], score: x[1], rank: r }; });
  })();

  var state = { enrolled: {}, menuOpen: false, signedIn: false, step: 0, form: { name: "", url: "", phone: "", level: "" }, submitted: null, error: "", typed: false };
  var app = document.getElementById("app");
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (x) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (x) { return null; } }
  if (load("ag_in") === "1") state.signedIn = true;
  try { state.enrolled = JSON.parse(load("ag_enrolled") || "{}") || {}; } catch (x) {}
  var timers = [];
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function typeInto(el, text, speed, done) {
    if (!el) { if (done) done(); return; }
    if (REDUCED) { el.textContent = text; if (done) done(); return; }
    var i = 0; el.textContent = "";
    (function tick() {
      if (!document.body.contains(el)) return;
      el.textContent = text.slice(0, ++i);
      if (i < text.length) timers.push(setTimeout(tick, speed + Math.random() * speed * 0.6));
      else if (done) done();
    })();
  }
  function typeValue(input, text, speed, done) {
    if (!input) { if (done) done(); return; }
    if (REDUCED) { input.value = text; if (done) done(); return; }
    var i = 0; input.value = "";
    (function tick() {
      if (!document.body.contains(input)) return;
      input.value = text.slice(0, ++i);
      if (i < text.length) timers.push(setTimeout(tick, speed + Math.random() * speed * 0.8));
      else if (done) done();
    })();
  }

  function route() { var h = location.hash.replace("#", ""); return ROUTES.indexOf(h) > -1 ? h : "dashboard"; }
  function head(title, desc) { return '<div class="page-head"><h1>' + esc(title) + '</h1>' + (desc ? '<p class="muted">' + esc(desc) + '</p>' : '') + '</div>'; }
  function logo() { return '<span class="logo"><img src="' + LOGO.light + '" alt="Alta School of Technology"></span>'; }

  function linkCards(arr) { return '<div class="grid">' + arr.map(function (x) { return '<a class="linkcard" href="' + x[1] + '" target="_blank" rel="noopener noreferrer"><span>' + esc(x[0]) + '</span><span class="go">Open &#8599;</span></a>'; }).join("") + '</div>'; }

  var views = {
    dashboard: function () {
      return '<div class="narrow"><section class="card hero"><p class="eyebrow">Welcome, ' + esc(ME) + '</p>' +
        '<h1 id="hero-title" class="caret" aria-label="AI Genesis 2026">AI Genesis 2026</h1>' +
        '<p class="muted">A live, online programme. This demo shows the kind of portal an event like this can have.</p></section>' +
        '<div class="quick">' + [["sessions", "Live Sessions", "Enroll and join"], ["leaderboard", "Leaderboard", "Rank #4"], ["homework", "Homework", "4 levels"], ["social", "Social media", "Alta pages"], ["campuses", "Campuses", "5 campuses"]]
          .map(function (q) { return '<a href="#' + q[0] + '">' + icon(q[0]) + '<b>' + q[1] + '</b><span class="muted small">' + q[2] + '</span></a>'; }).join("") + '</div>' +
        '<section class="card"><h2 style="margin-bottom:8px">About this demo</h2><p class="muted">This website is only a demo. It shows how a participant portal with login, sessions, a leaderboard, homework submission and programme links can be built, so the same kind of site can be created for future events like AI Genesis 2026.</p></section></div>';
    },
    sessions: function () {
      var now = Date.now();
      return '<div class="narrow">' + head("Live Sessions", "AI Genesis Challenge. 4 live sessions at 6:00 PM IST. Enroll first, then join.") +
        '<img class="banner-img" src="' + BANNER + '" alt="AI Genesis Challenge: 4 live sessions at 6 PM IST on Sat 14 Nov, Sat 21 Nov, Wed 25 Nov and Sat 28 Nov">' +
        '<section class="card"><ul class="list divide">' +
        sessions.map(function (s) {
          var past = s.when.getTime() < now, en = !!state.enrolled[s.id];
          var action = past ? '<span class="chip done">Completed</span>'
            : en ? '<span class="chip ok">Enrolled</span>'
            : '<button class="btn btn-primary" data-enroll="' + s.id + '">Enroll</button>';
          var join = (!past && en) ? '<div class="box"><span class="small">Meeting ID <span class="mid">' + MEETING_ID + '</span></span><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost" data-copy="' + MEETING_ID + '">Copy ID</button><button class="btn btn-primary" data-join="' + s.id + '">Join session</button></span></div>' : '';
          return '<li><div class="row"><div class="grow"><h3>AI Genesis Challenge: Session ' + s.n + '</h3><p class="muted small">' + esc(fmtDate(s.when)) + ', ' + esc(fmtTime(s.when)) + '</p>' +
            (!past && !en ? '<p class="muted small" style="margin-top:4px">Enroll to unlock the Join button.</p>' : '') + '</div>' + action + '</div>' + join + '</li>';
        }).join("") + '</ul></section></div>';
    },
    leaderboard: function () {
      return '<div class="narrow">' + head("Leaderboard", "Ranks update when the programme team changes a score. Ties share a rank.") +
        '<section class="card table-wrap" style="padding:6px 8px"><table><thead><tr><th>Rank</th><th>Participant</th><th class="num">Score</th></tr></thead><tbody>' +
        ranked.map(function (r) { return '<tr' + (r.name === ME ? ' class="me"' : '') + '><td>' + r.rank + '</td><td>' + esc(r.name) + (r.name === ME ? ' (you)' : '') + '</td><td class="num">' + r.score + '</td></tr>'; }).join("") +
        '</tbody></table></section></div>';
    },
    social: function () {
      return '<div class="narrow">' + head("Alta Social Media", "Public pages from the Alta School of Technology website. They open in a new tab.") +
        '<section class="card">' + linkCards(SOCIAL) + '</section></div>';
    },
    campuses: function () {
      return '<div class="narrow">' + head("Alta Campuses", "Campus pages from the Alta School of Technology website. They open in a new tab.") +
        '<section class="card">' + linkCards(CAMPUSES) + '</section></div>';
    },
    homework: function () {
      if (state.submitted) {
        var s = state.submitted;
        return '<div class="narrow">' + head("Homework") + '<section class="card thanks"><div class="tick">' + icon("tick") + '</div><h2>Thank you, your homework is submitted.</h2>' +
          '<p class="muted">This is a demo, so nothing was sent anywhere.</p><dl><dt>Name</dt><dd>' + esc(s.name) + '</dd><dt>Website</dt><dd>' + esc(s.url) + '</dd><dt>Phone</dt><dd>' + esc(s.phone) + '</dd><dt>Level</dt><dd>' + esc(LEVELS[s.level][0] + ": " + LEVELS[s.level][1]) + '</dd></dl>' +
          '<button class="btn btn-ghost" id="again">Submit another</button></section></div>';
      }
      var f = state.form, st = state.step, body = "";
      var q = ["What is your name?", "Share your website link", "What is your phone number?", "Which level is this homework for?"][st];
      if (st === 0) body = '<label for="f-name">Full name<input id="f-name" type="text" autocomplete="off" value="' + esc(f.name) + '" placeholder="Your name"></label>';
      if (st === 1) body = '<label for="f-url">Website link<input id="f-url" type="url" autocomplete="off" value="' + esc(f.url) + '" placeholder="https://your-site.github.io"></label>';
      if (st === 2) body = '<label for="f-phone">Phone number<input id="f-phone" type="tel" inputmode="tel" autocomplete="off" value="' + esc(f.phone) + '" placeholder="10-digit mobile number"></label>';
      if (st === 3) body = '<fieldset class="levels" aria-label="Project level">' + LEVELS.map(function (l, i) {
        return '<label><input type="radio" name="level" value="' + i + '"' + (String(f.level) === String(i) ? " checked" : "") + '><span class="opt"><b>' + l[0] + ': ' + l[1] + '</b><span class="muted small">' + l[2] + '</span></span></label>';
      }).join("") + '</fieldset>';
      return '<div class="narrow">' + head("Homework", "Answer four quick questions to submit your project.") +
        '<form id="hw" class="card" style="display:grid;gap:16px" novalidate><div class="steps" aria-label="Step ' + (st + 1) + ' of 4">' + [0, 1, 2, 3].map(function (i) { return '<span class="' + (i <= st ? "on" : "") + '"></span>'; }).join("") + '</div>' +
        '<h2>' + q + '</h2>' + body + (state.error ? '<p class="err" role="alert">' + esc(state.error) + '</p>' : '') +
        '<div class="row"><button type="button" class="btn btn-ghost" id="back"' + (st === 0 ? " hidden" : "") + '>Back</button><button type="submit" class="btn btn-primary" style="margin-left:auto">' + (st === 3 ? "Submit homework" : "Next") + '</button></div></form></div>';
    }
  };

  function loginView() {
    return '<div class="wrap auth"><div class="card"><div style="display:flex;justify-content:center">' + logo() + '</div>' +
      '<div style="text-align:center"><h1 id="login-title" class="caret" aria-label="AI Genesis 2026">&nbsp;</h1><p class="muted small" style="margin-top:4px">Participant portal demo</p></div>' +
      '<form id="login" style="display:grid;gap:14px" novalidate>' +
      '<label for="email">Email<input id="email" type="email" autocomplete="off" placeholder="you@example.com"></label>' +
      '<label for="pw">Password<input id="pw" type="password" autocomplete="off" placeholder="Password"></label>' +
      '<button class="btn btn-primary" type="submit" style="width:100%;padding:12px">Log in</button></form>' +
      '<p class="muted small" style="text-align:center;border-top:1px solid var(--line);padding-top:14px">Demo only. Credentials type themselves in, or enter anything and log in. Nothing is checked or stored.</p></div></div>';
  }

  function shell(r) {
    var cur = MENU.filter(function (m) { return m[0] === r; })[0] || MENU[0];
    var items = MENU.map(function (m) { return '<a href="#' + m[0] + '"' + (r === m[0] ? ' aria-current="page"' : '') + '>' + icon(m[0]) + m[1] + '</a>'; }).join("");
    return '<header class="top wrap"><div class="inner"><div class="left"><a href="#dashboard" aria-label="Home" style="display:block">' + logo() + '</a><span class="event">AI Genesis 2026</span></div>' +
      '<div class="right"><button class="pill" id="theme" type="button">Theme</button><span class="avatar" title="' + esc(ME) + '">A</span><button class="pill" id="logout" type="button">Log out</button></div></div></header>' +
      '<div class="menubar wrap"><div class="inner"><button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu-panel"><span><span class="k">Menu</span><span class="v">' + cur[1] + '</span></span>' + icon("chev") + '</button>' +
      '<div class="menu-panel" id="menu-panel" role="navigation" aria-label="Sections" hidden>' + items + '</div></div></div>' +
      '<main class="wrap"><div class="inner" id="view">' + views[r]() + '</div></main>';
  }

  function after(r) {
    clearTimers();
    if (r === "login") {
      var t = document.getElementById("login-title");
      typeInto(t, "AI Genesis 2026", 70, function () {
        typeValue(document.getElementById("email"), "aarav@example.com", 45, function () {
          typeValue(document.getElementById("pw"), "demo-password", 55);
        });
      });
    } else if (r === "dashboard") {
      var h = document.getElementById("hero-title");
      typeInto(h, "AI Genesis 2026", 80, function () { if (h) h.classList.add("off"); });
    } else if (r === "homework") {
      var el = document.querySelector("#hw input[type=text], #hw input[type=url], #hw input[type=tel]");
      if (el) el.focus({ preventScroll: true });
    }
  }

  var toastEl;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement("div"); toastEl.setAttribute("role", "status");
      toastEl.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.85rem;z-index:50;max-width:90vw";
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastEl._t); toastEl._t = setTimeout(function () { toastEl.hidden = true; }, 2400);
  }

  function render() {
    var r = route();
    if (!state.signedIn) r = "login"; else if (r === "login") r = "dashboard";
    app.innerHTML = r === "login" ? loginView() : shell(r);
    window.scrollTo(0, 0); after(r);
  }
  function rerenderView() { var v = document.getElementById("view"); if (v) { v.innerHTML = views[route()](); after(route()); } }

  document.addEventListener("click", function (e) {
    var mp = document.getElementById("menu-panel"), mb = document.getElementById("menu-btn");
    if (mp && !e.target.closest("#menu-btn") && !e.target.closest("#menu-panel")) { mp.hidden = true; mb.setAttribute("aria-expanded", "false"); }
    var t = e.target.closest("[data-demo],[data-enroll],[data-join],[data-copy],#menu-btn,#logout,#theme,#again,#back");
    if (!t) return;
    if (t.id === "menu-btn") { var open = mp.hidden; mp.hidden = !open; mb.setAttribute("aria-expanded", String(open)); return; }
    if (t.dataset.enroll) { state.enrolled[t.dataset.enroll] = true; store("ag_enrolled", JSON.stringify(state.enrolled)); rerenderView(); toast("You are enrolled. The Join button is now unlocked."); return; }
    if (t.dataset.join) { toast("Demo only: this would open the meeting with ID " + MEETING_ID + "."); return; }
    if (t.dataset.copy) { try { navigator.clipboard.writeText(t.dataset.copy).then(function () { toast("Meeting ID copied."); }, function () { toast("Meeting ID: " + t.dataset.copy); }); } catch (x) { toast("Meeting ID: " + t.dataset.copy); } return; }
    if (t.dataset.demo) toast(t.dataset.demo);
    else if (t.id === "logout") { state.signedIn = false; store("ag_in", null); location.hash = "login"; render(); }
    else if (t.id === "again") { state.submitted = null; state.step = 0; state.form = { name: "", url: "", phone: "", level: "" }; state.error = ""; rerenderView(); }
    else if (t.id === "back") { state.step = Math.max(0, state.step - 1); state.error = ""; rerenderView(); }
    else if (t.id === "theme") {
      var cur = document.documentElement.getAttribute("data-theme");
      var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    }
  });

  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "login") { state.signedIn = true; store("ag_in", "1"); location.hash = "dashboard"; render(); return; }
    if (e.target.id !== "hw") return;
    var f = state.form, st = state.step, err = "";
    if (st === 0) { var n = document.getElementById("f-name").value.trim(); f.name = n; if (n.length < 2) err = "Enter your full name."; }
    if (st === 1) {
      var u = document.getElementById("f-url").value.trim(); f.url = u;
      try { var p = new URL(u); if (p.protocol !== "https:" && p.protocol !== "http:") err = "Enter a link starting with https://."; } catch (x) { err = "Enter a full link, for example https://your-site.github.io."; }
    }
    if (st === 2) { var ph = document.getElementById("f-phone").value.trim(); f.phone = ph; var digits = ph.replace(/\D/g, ""); if (digits.length < 10 || digits.length > 13 || !/^[+\d\s()-]+$/.test(ph)) err = "Enter a valid phone number with at least 10 digits."; }
    if (st === 3) { var c = document.querySelector('input[name="level"]:checked'); if (!c) err = "Choose a level."; else f.level = c.value; }
    state.error = err;
    if (err) { rerenderView(); return; }
    if (st < 3) { state.step++; rerenderView(); }
    else { state.submitted = { name: f.name, url: f.url, phone: f.phone, level: Number(f.level) }; rerenderView(); }
  });
  document.addEventListener("change", function (e) { if (e.target.name === "level") state.form.level = e.target.value; });

  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { var mp = document.getElementById("menu-panel"), mb = document.getElementById("menu-btn"); if (mp && !mp.hidden) { mp.hidden = true; mb.setAttribute("aria-expanded", "false"); mb.focus(); } } });
  window.addEventListener("hashchange", render);
  render();
})();
</script>

</body>
</html>
